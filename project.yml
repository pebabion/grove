name: Grove
options:
  bundleIdPrefix: com.pebabion
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  GroveCore:
    path: .

targets:
  Grove:
    type: application
    platform: macOS
    sources:
      - path: Grove
    dependencies:
      - package: GroveCore
        product: GroveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pebabion.Grove
        PRODUCT_NAME: Grove
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox. Grove spawns git, gh and per-repo setup scripts, and
        # reads repositories anywhere on disk. A sandbox cannot express that, so
        # distribution is a notarized DMG rather than the App Store.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
