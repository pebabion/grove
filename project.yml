name: Grove
options:
  bundleIdPrefix: com.pebabion
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "14.0"

packages:
  GroveCore:
    path: .
  # The only third-party dependency, and it earns it: a terminal emulator is
  # months of work — PTY handling, VT100 parsing, a screen buffer, rendering,
  # resize, selection. MIT licensed. Used by the app target only, so GroveCore
  # stays dependency-free and `swift test` never fetches anything.
  #
  # 1.15 ships a Metal shader. Xcode 16 bundles the Metal toolchain, which is what
  # CI runs; Xcode 26 makes it a separate 688MB download, so a local build needs
  # `xcodebuild -downloadComponent MetalToolchain` once. Worth it: 1.14 renders
  # local input immediately and applies backpressure to PTY reads, which is the
  # difference between typing feeling instant and feeling laggy.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.16.0
  # highlight.js in JavaScriptCore. Chosen over tree-sitter because a read-only view
  # gains nothing from incremental reparsing, and the grammar bundles that would make
  # tree-sitter practical are a 1.4GB repository with no declared licence.
  Highlightr:
    url: https://github.com/raspu/Highlightr
    from: 2.3.0

targets:
  Grove:
    type: application
    platform: macOS
    sources:
      - path: Grove
    dependencies:
      - package: GroveCore
        product: GroveCore
      - package: SwiftTerm
        product: SwiftTerm
      - package: Highlightr
        product: Highlightr
    # An explicit plist, because GENERATE_INFOPLIST_FILE has no build setting for
    # CFBundleIconFile and the app icon has to be named somewhere.
    info:
      path: Grove/Info.plist
      properties:
        CFBundleIconFile: Grove
        # Take these from the build settings. Left out, XcodeGen writes a literal
        # 1.0 and every release reports the same version whatever the tag says.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pebabion.Grove
        PRODUCT_NAME: Grove
        MARKETING_VERSION: "0.10.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_HARDENED_RUNTIME: YES
        # No App Sandbox. Grove spawns git, gh and per-repo setup scripts, and
        # reads repositories anywhere on disk. A sandbox cannot express that, so
        # distribution is a signed DMG rather than the App Store.
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: YES
